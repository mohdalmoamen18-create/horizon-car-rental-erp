name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Create Web Directory and Files
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizon ERP</title><style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;background:#f3f4f6;}a{padding:15px 30px;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px;font-size:18px;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,0.1);}</style></head><body><a href="https://github.com" target="_blank">دخول إلى نظام تأجير السيارات</a></body></html>' > dist/index.html
          echo '{"name": "horizon-app", "version": "1.0.0", "scripts": {"build": "echo build"}}' > package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Configure Capacitor
        run: |
          npx cap init "Horizon Car Rental" "com.horizon.carrental" --web-dir=dist
          npx cap add android
          npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4 
        with:
          name: horizon-car-rental-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

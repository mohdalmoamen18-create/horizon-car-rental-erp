name: Android Diagnostic - Collect Gradle Outputs
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Web Directory
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Horizon Car Rental ERP</title>
            </head>
            <body>
              <h1>Horizon Car Rental ERP</h1>
            </body>
          </html>
          HTML

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "horizon-car-rental-erp",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.1.2",
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2"
            }
          }
          EOF

      - name: Install npm dependencies
        run: npm install

      - name: Initialize Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap init "Horizon Car Rental" "com.horizon.carrental" --web-dir=dist
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: "Step 1: Gradle Dependency Tree"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew app:dependencies --stacktrace > ../01-gradle-dependencies.txt 2>&1 || true

      - name: "Step 2: Kotlin-stdlib-jdk7 Insight"
        run: |
          cd android
          ./gradlew app:dependencyInsight --dependency kotlin-stdlib-jdk7 --stacktrace > ../02-kotlin-stdlib-jdk7.txt 2>&1 || true

      - name: "Step 3: Kotlin-stdlib-jdk8 Insight"
        run: |
          cd android
          ./gradlew app:dependencyInsight --dependency kotlin-stdlib-jdk8 --stacktrace > ../03-kotlin-stdlib-jdk8.txt 2>&1 || true

      - name: "Step 4: android/build.gradle"
        run: |
          if [ -f "android/build.gradle" ]; then
            cp android/build.gradle ./04-android-build-gradle.txt
          fi

      - name: "Step 5: android/app/build.gradle"
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cp android/app/build.gradle ./05-android-app-build-gradle.txt
          fi

      - name: "Step 6: gradle-wrapper.properties"
        run: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            cp android/gradle/wrapper/gradle-wrapper.properties ./06-gradle-wrapper.txt
          fi

      - name: "Verify logs generated"
        run: |
          echo "📋 Generated files:"
          ls -lh *.txt 2>/dev/null || echo "No txt files generated"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-logs
          path: |
            01-gradle-dependencies.txt
            02-kotlin-stdlib-jdk7.txt
            03-kotlin-stdlib-jdk8.txt
            04-android-build-gradle.txt
            05-android-app-build-gradle.txt
            06-gradle-wrapper.txt
          retention-days: 7

name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Web Directory and Files
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Horizon ERP</title>
            </head>
            <body>
              <h1>Horizon ERP</h1>
            </body>
          </html>
          HTML

          cat > package.json <<'JSON'
          {
            "name": "horizon-app",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            },
            "dependencies": {
              "@capacitor/core": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/android": "6.1.2"
            }
          }
          JSON

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor
        run: |
          if [ ! -d android ]; then
            npx cap init "Horizon Car Rental" "com.horizon.carrental" --web-dir=dist
            npx cap add android
          fi
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-car-rental-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
